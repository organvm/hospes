name: Bug report
description: Report reproducible incorrect behavior without private production data.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, real contact details, correspondence, or unpublished data.
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: What happened, using synthetic or redacted inputs?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Minimal commands or code using synthetic data.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, personal data, correspondence, and private source material.
          required: true
