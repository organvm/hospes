  - candidate_claims
  - citations
  - counterarguments
  - evidence
  - segment_candidates
  - risk_flags
  source_policy:
    scheme: https
    allowlist: config/research.yaml allowed_sources
    refuse_credentials_in_url: true
    refuse_explicit_port: true
    refuse_ip_literal_host: true
    refuse_loopback_host: true
  cost_policy:
    ceiling_source: config/research.yaml max_cost_minor
    priced_before_call: true
    per_provider: config/research.yaml provider_costs_minor
  review_policy:
    requires_citation: true
    requires_counterargument: true
    requires_verified_claim_for_retrieval: true
    lock_requires_review: true
    content_checksum: sha256
network_dashboard_contract:
  version: 1
  role: network_operator
  scope: tenant
  pipeline_milestones: [APPROVED, BOOKED, PUBLISHED]
  velocity_window_days: 28
  report_formats: [html, json, pdf]
  receipt_table: network_report_receipts
  receipt_event: network.health_report_exported
  invariants:
  - The network portfolio, its per-show drilldown, and its health report admit the network_operator role alone; holding a per-show role inside the tenant does not widen a read to the portfolio.
  - Scope is the authenticated identity's tenant and is never widened by a path segment or a payload; the drilldown resolves its show through that tenant's active show registry and answers 404 for anything else.
  - Pipeline counts read the canonical ordinals in spec/states.json, so a candidate counts toward a milestone once it has reached or passed it and a branch state is reported as off-ladder rather than folded into the funnel.
  - Sponsor revenue comes from the sponsor organ's revenue report rather than a second money calculation, so the portfolio and the Revenue view cannot disagree about a number.
  - Every rendered health report appends an attributable network_report_receipts row carrying the actor, role, format, and SHA-256 checksum of the exact document handed over before the body is returned.
  - Report HTML escapes every operator-supplied value, including show labels and guest names, and references no external asset.
  - PDF rendering requires the declared optional pdf extra and reports the missing extra rather than returning a partial document.
  - The portfolio writes no show state; it is a projection over rows the per-show views already own.
