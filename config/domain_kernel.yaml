relationship_classes:
  C0: no_connection
  C1: public_adjacency
  C2: prior_professional_interaction
  C3: recurring_colleague
  C4: friend
  C5: close_friend_mentor_or_sensitive
hard_rules:
- No automatic messages from a host's personal account.
- No C4/C5 outreach without explicit relationship-owner approval.
- C4/C5 correspondence drafts are never rendered or persisted by HOSPES.
- No invented familiarity, praise, consumption, or mutual connection.
- No contact-route use without source provenance and verification timestamp.
- Candidate contact rosters admit raw values only at the private import boundary; each name, email, phone, and note is encrypted independently before persistence.
- Public opportunity and contact-route contracts expose opaque private-field references only; decrypted roster values are transient and restricted to host, producer, editorial-owner, or relationship-owner sessions.
- Contact roster routes marked opted_out are terminal, and invitation prefill selects only verified, permitted, usable routes without sending or persisting the private value in a draft.
- Informal touchpoints derive their initiator from the authenticated operator, encrypt notes with full tenant/show/record AAD, and never advance opportunity or Pilot state.
- Sponsor contact details and deal terms are never stored: a sponsor record carries only opaque custody references to their external owner.
- One episode ad slot is sellable to exactly one sponsor, and recognized revenue counts sold assignments only; a reserved slot earns nothing.
- Recording a sale is bookkeeping about a human decision made outside HOSPES; no sponsorship route invoices, signs, or commits the show.
- A sponsor claim is unapproved until an editorial or relationship owner approves it for external use, and every claim carries a public source and a verification date.
- A committed slot left unsold, and a sold sponsor's unapproved claim, are publication blockers on the same predicate that enforces rights clearance; both rules are per-show configuration, not code.
- Cross-season guest memory keys on one opaque tenant/show-scoped guest identity; season, episode, disposition, and date are operational metadata while note plaintext stays in encrypted custody or an external owner.
- A do-not-contact directive is the live authority and only a relationship owner may set or lift it; absent a directive the append-only guest-history marker still blocks, and a blocked guest is refused at import, draft preview, draft persistence, and outreach receipts alike.
- Team notifications are addressed to a team role, carry bounded non-private titles and opaque entity references only, and may be marked read solely by the addressed role.
- A lifecycle transition emits at most one notification and one queue assignment per entity and role; replay is idempotent, and a show absent from the active show registry emits neither.
- Notification email and webhook output is a checksummed preview of critical notifications only. HOSPES never delivers it: an external delivery requires a permitting show outbound mode, a runtime whose draft-only notification default is disabled, a human authorization receipt bound to that exact preview, and an immutable delivery receipt.
- No raw home-address inference or scraping.
- No contractual, financial, editorial-removal, or reputational commitment without
  human approval.
- Every outbound action writes an AuditEvent.
- Every external thread has a real human owner.
- Every new record carries tenant_id and show_id; network visibility never grants cross-show access.
- Guest portal access is disabled by default and, when enabled, is isolated from the operator surface.
- Draft, manual-receipt, and provider-connected distribution modes coexist; outbound execution requires a human authorization receipt.
- Provider selection is registry- and precedence-driven; unavailable providers remain visible as unconfigured or unavailable.
- Research output requires citations, a bounded cost, human review, and a lock receipt before downstream use.
- Analytics is a read organ: every stored metric names the provider receipt that authorized its read, scheduled analytics jobs are restricted to the read operation, and a provider without a declared export or a provisioned credential wall stays visibly unconfigured or blocked instead of being substituted.
- Research providers are priced before they are called; a job whose projected cost exceeds its ceiling never reaches the provider.
- Research citations come only from the configured source allowlist, and a refused source is recorded as a risk flag rather than silently dropped.
- Every research retrieval writes a provider receipt naming the source, endpoint, cost, and how many results were cited or refused.
- Reviewed research is frozen against its own content checksum; a brief mutated after review can be neither reviewed nor locked.
- Only producer and editorial-owner sessions start, annotate, review, or lock bounded research.
- Tenant-wide identity mappings are unique per provider subject; show-scoped mappings never grant authority outside their composite tenant/show boundary.
- Live SQLite connections hold a shared custody lock, and additive shadow migrations require the exclusive form before an atomic database swap.
- Delivery receipts bind the exact distribution subject and publish action to one attributable authorization receipt.
- Background jobs are tenant/show scoped, leased, retry-bounded, timeout-bounded, cost-bounded, and idempotent; scheduled jobs never send or publish.
- Tenant data-encryption keys are AES-256-GCM, versioned, and wrapped by a credential-wall master key that is never persisted.
- Private field ciphertext authenticates tenant, show, table, record, field, category, and key version; cross-scope replay fails closed.
- Contact, correspondence, consent, financial, private-relationship, research, and artifact metadata live only in encrypted tenant custody or an external private owner; public surfaces expose opaque references.
- Local and S3-compatible artifact stores receive client-side ciphertext and verify both encrypted-object and plaintext checksums before returning content.
- RECORDING_READY requires booking, consent, verified brief, technical preflight,
  and declared preflight-package receipts.
- A technical rehearsal is never recorded as a completed guest pilot.
- Partnership agreements and deals are stored only as bounded operating summaries
  plus opaque references to their canonical external owners.
- Normal partnership item writes cannot assign superseded; only the revision-checked
  supersession operation can.
- Pilot candidate slots reject C4/C5 before any slot mutation or audit write.
- Ineligible lifecycle states cannot enter or satisfy the active pilot slate.
- Ari review receipts require a process-bound relationship-owner session.
- Every advertised reply classification leaves active outreach in an explicit lifecycle
  state; representative and information requests pause for human handling, while an
  explicit later request moves to REVISIT_LATER.
- Pilot schedules are derived from evidence, deadline slack, production dependencies,
  relationship exposure, route and owner independence, replies, and fallback value.
- Pilot planning and decisions can schedule or draft, but no route sends correspondence.
- Every Pilot decision is revision-checked and append-only; assignment state changes retain
  attributable history and never fabricate a decline from silence.
- Multiple concurrent asks require independent routes and owners plus an explicit
  relationship-owner decision, and must remain inside the policy exposure budget.
- Draft preview is limited to approved pre-outreach states. Copy and outreach receipts
  require persisted human-reviewed metadata; correspondence bodies remain external.
- Pilot completion is fourteen explicit gates. Recording readiness is gates 1-10,
  guest recording authority is gates 1-11, and completion is all fourteen.
- Synthetic runtime stores carry a tenant-scoped engine.synthetic_demo marker and
  are never accepted as canonical Pilot authority.
- Live domain writes use the production UTC clock and UUID4 identities. Synthetic
  fixture construction alone may install a scoped frozen clock and purpose-ordinal
  UUID5 identities.
- A synthetic generation is one marker-v2/build-receipt-v2 transaction containing
  the review specimen, completed specimen, and redacted receipt. Mixed generations
  are invalid. Its generation id is derived from generated_at plus receipt_version,
  and every recorded SHA-256 checksum is lowercase hexadecimal.
- Synthetic bundle replacement holds an exclusive private lease, stages on the
  destination filesystem, fsyncs every journal phase, and either commits or restores
  the prior three-artifact generation.
- Every synthetic database must pass regular-path, no-symlink, no-sidecar, migration
  ledger, SQLite integrity, and foreign-key validation before installation or use.
- The review specimen permits lifecycle-valid human writes. The completed specimen
  remains receipt-checksum-bound and is opened with SQLite query_only in addition
  to the HTTP write guard.
- Synthetic operator mode rejects raw /v1 exposure and marked/unmarked runtime-mode
  mismatches before a mutable SQLite connection is opened.
- Browser identity is process-owned in local mode or derived from an origin-validated Cloudflare
  Access JWT whose subject maps to an internal tenant/show role. Browser actor, role, and tenant
  headers are stripped or ignored, and every browser mutation requires identity-bound CSRF proof.
- Completed browser mode exposes no write, copy, or export surface. Restricted host
  sessions do not request Pilot plans. Only the relationship owner may authorize
  multi-activation, pause, promotion, or fallback.
- >-
  Public synthetic access has exactly two gates: exact Cloudflare account/tunnel/
  One-time-PIN custody, then exact application/policy/DNS/ingress readback.
  A schema-bound redacted Access receipt v1 must prove both gates without identities,
  hostnames, URLs, credentials, or resource identifiers.
- Local start/stop holds a lifecycle lock, gives child processes whitelisted
  environments, scrubs setup secrets, records PID plus process-start identity in an
  atomic process ledger v1, proves operator ports and live connector readiness, bounds
  TERM/KILL cleanup, exits nonzero after any failed-start cleanup, and never deletes
  remote configuration.
- PacketSource documents are versioned synthetic-only inputs generated from the
  tracked manifest into an explicitly selected demo output directory.
- PacketSource export rejects protected candidates, forbidden private fields,
  private text in any rendered string, and factual host or episode assertions
  that lack an approved cited PacketClaim.
