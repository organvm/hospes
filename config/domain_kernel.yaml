packet_source_contract:
  version: 1
  pilot_ids:
  - pilot-a
  - pilot-b
  - pilot-c
  required_fields:
  - pilot_id
  - guest_name
  - city
  - studio
  - recording_window
  - relationship_class
  - host_bio
  - episode_thesis
  - invitation_note
  - asset_items
  - claims
  claim_fields:
  - claim
  - source_url
  - verified_date
  - approved_for_external_use
  invariants:
  - The document declares version 1 and contains exactly the three allowed pilot ids.
  - C4 and C5 sources cannot be exported; an explicit protected marker must be a
    boolean, and true sources cannot be exported.
  - Every claim is cited, verification-dated, and explicitly approved for external use.
  - Host biography and episode thesis text must equal an approved cited claim.
  - Private fields and correspondence-, signature-, agreement-, private-key-, email-,
    or phone-like rendered text are rejected before rendering.
receipt_contract:
  allowed_types:
  - outreach.sent
  - reply.classified
  - booking.confirmed
  - consent.signed
  - recording.ready
  - recording.completed
  - media.ingested
  required_identity:
  - actor_id
  - actor_role
  - tenant_id
  - occurred_at
  - opaque_external_reference
  prohibitions:
  - No receipt endpoint sends, delivers, books, signs, records, ingests, or publishes.
  - No raw correspondence or signed document may appear in a receipt.
  detail_schemas:
    outreach.sent: []
    reply.classified:
    - classification
    booking.confirmed:
    - studio_ref
    - producer_ref
    - recording_time
    consent.signed:
    - private_pilot
    - clip_scope
    recording.ready:
    - preflight_ref
    - asset_package_id
    recording.completed:
    - session_kind
    media.ingested:
    - master_ref
    - checksum_ref
sponsor_inventory_contract:
  version: 1
  slot_types: [pre, mid, post]
  assignment_states: [available, reserved, sold]
  sponsor_states: [active, paused, ended]
  private_fields: [contact_ref, terms_ref]
  export_columns: [Episode, Sponsor, Slot, Rate, Date]
  configurable_rules:
    - block_publication_on_unfilled_committed_slots
    - require_approved_claims_before_publication
  configuration_precedence: [config/shows/<show>.yaml, config/runtime.yaml]
  invariants:
  - Declared inventory is a first-class row, so an unsold slot is representable and sold versus available never has to be inferred.
  - One episode slot is held by at most one sponsor, and withdrawing a held slot is a conflict rather than a silent erasure of a sale.
  - Money is stored as integer minor units with an ISO 4217 currency, and only sold assignments are recognized as revenue.
  - Sponsor contact and terms remain opaque custody references; a raw contact-like value is rejected at the write boundary.
  - Claims are cited, verification-dated, and unapproved by default; only an editorial or relationship owner may approve or withdraw external use.
  - Every inventory, assignment, release, and claim decision writes an attributable sponsorship receipt whose actor and role come from the authenticated operator.
  - The accounting export emits exactly the five declared columns and neutralizes spreadsheet-formula prefixes.
  - Publication blockers compose with rights clearance in one predicate; a show that sells no committed inventory turns the committed-slot rule off in its own configuration.
guest_crm_contract:
  version: 1
  identity: [tenant_id, show_id, guest_id]
  memory_fields: [season, episode, disposition, date, notes]
  dispositions: [APPROVED, DECLINED, SOFT_DECLINE, HARD_DECLINE, NO_RESPONSE, REVISIT_LATER, PROTECTED, DO_NOT_CONTACT, RECORDED, PUBLISHED, CANCELLED]
  directive_roles: [relationship_owner]
  enforcement_points: [candidate_import, draft_preview, correspondence_draft, outreach_receipt, guest_suggestions, relationship_nurture]
  badge_format: "Previously: {season}{episode} — {disposition} ({date})"
  invariants:
  - One opaque guest identity spans every season of one show; an import row may declare it and otherwise inherits the opaque source key.
  - A terminal decision on an opportunity that declares its season and episode appends exactly one idempotent memory entry attributed to the deciding operator.
  - The guest_directives row is the live do-not-contact authority; with no directive the append-only guest_history marker still blocks, so a legacy block is never silently lifted.
  - Only a relationship owner may set or lift a directive, from the approval card or a relationship-owner import row.
  - A blocked guest cannot be re-imported, drafted, previewed, or given an outreach receipt, and is withheld from suggestions and nurture cadence.
  - Directive-derived entries stay in the timeline but never become the approval-card badge, which reports the last real season interaction.
touchpoint_contract:
  kind: informal_touchpoint
  channels: [text, email, ig, in-person, phone, hallway]
  private_fields: [notes]
  filter_fields: [guest_id, opportunity_id, partnership_id, channel, initiator, from_at, to_at]
  invariants:
  - Initiator id and role come only from the authenticated operator session.
  - Notes are AES-256-GCM ciphertext at rest and plaintext exists only in an authorized no-store response.
  - Recording a touchpoint appends attributable audit evidence without changing any workflow state.
clearance_contract:
  version: 1
  kind: rights_clearance
  types: [music, clip, IP, footage, guest_likeness]
  statuses: [pending, cleared, denied]
  publishable_status: cleared
  blocking_statuses: [pending, denied]
  custody_modes: [sealed, external_reference]
  private_fields: [rights_holder, license_terms]
  decision_roles: [producer, editorial_owner, relationship_owner]
  filter_fields: [episode_id, status, clearance_type, due_before, blocking_only]
  receipt_events: [clearance.recorded, clearance.cleared, clearance.denied, clearance.reopened]
  report_format: csv
  invariants:
  - Every clearance, receipt, badge, report row, and API read is constrained to one tenant and show.
  - Rights holder and licence terms are AES-256-GCM ciphertext behind private-field references whenever a tenant field vault is configured; without one the operator must supply an opaque external custody reference and the record says so through custody_mode rather than storing a private literal.
  - Every status decision requires an opaque evidence reference and appends an immutable clearance receipt naming the deciding operator, the previous status, and the new one.
  - Publication is denied for every status other than cleared — pending and denied alike — at draft, authorization, and mark-published.
  - Recorder and decider identity and role come only from the authenticated operator session.
  - The CSV clearance report carries opaque references only, never decrypted rights holder or licence text, and neutralizes spreadsheet-formula prefixes.
notification_contract:
  version: 1
  team_roles: [host, network_operator, producer, editorial_owner, relationship_owner, editor]
  assigning_roles: [producer, editorial_owner, relationship_owner, network_operator]
  notification_types: [draft_ready, brief_ready, clips_needed, booking_confirmed, assignment_assigned]
  assignment_types: [draft_review, brief_review, clip_production, schedule_prep]
  assignment_statuses: [open, in_progress, done, cancelled]
  severities: [normal, critical]
  delivery_channels: [email, webhook]
  delivery_statuses: [preview, authorized, delivered]
  delivery_authorization_action: notification.delivery
  draft_only_feature: notifications_are_draft_only
  transitions:
    appearance.approved:
      recipient_role: producer
      notification_type: draft_ready
      assignment_type: draft_review
      severity: normal
    brief.ready:
      recipient_role: host
      notification_type: brief_ready
      assignment_type: brief_review
      severity: normal
    booking.confirmed:
      recipient_role: producer
      notification_type: booking_confirmed
      assignment_type: schedule_prep
      severity: normal
    recording.completed:
      recipient_role: editor
      notification_type: clips_needed
      assignment_type: clip_production
      severity: critical
  invariants:
  - Every notification and assignment carries tenant and show scope, and the show must be
    an active row in the show registry before either is written.
  - A notification title is bounded operational prose; contact-, correspondence-, and
    agreement-like text is rejected, and a display subject that looks private degrades to a
    neutral subject rather than rejecting the lifecycle transition.
  - Transition emission joins the caller's transaction and is keyed by trigger, entity, and
    recipient role, so a replayed or rejected transition leaves no orphan bell item.
  - Only the addressed role may mark a notification read; mark-all clears that role alone.
  - Only the assigned role or a network operator may complete an assignment, and completion
    records the closing actor.
  - My Queue orders assignments by due date with null due dates last and marks overdue open
    work; it never advances an opportunity, Pilot, or distribution state.
  - The HTTP surface exposes previews, authorization, and receipts; it has no send route,
    and every delivery preview is checksummed and idempotent per key.
distribution_contract:
  version: 1
  kind: publishing_pipeline
  platforms: [rss, youtube, tiktok, reels, shorts, clip_queue]
  package_families: [rss, video, clip]
  statuses: [draft, blocked, authorized, scheduled, published, failed]
  deliverable_statuses: [authorized, scheduled, failed]
  delivery_modes: [manual_receipt, provider_connected]
  publish_roles: [editorial_owner, relationship_owner]
  write_roles: [producer, editorial_owner, relationship_owner]
  adapter_precedence: [rss, youtube_metadata, clip_queue, manual_external_receipt]
  receipt_events:
    - distribution.drafted
    - distribution.scheduled
    - distribution.authorized
    - distribution.published
    - distribution.failed
    - distribution.clip_queued
  webhook_events: [distribution.scheduled, distribution.published, distribution.failed]
  webhook_payload_schema: spec/distribution.schema.json
  filter_fields: [episode_id, platform_name, status, limit]
  invariants:
  - HOSPES never publishes; a publication is recorded from a manual receipt after a human published elsewhere, and every delivery names its delivery_mode.
  - Every package is one of three validated families, and a field outside the platform's family is refused at the write boundary rather than stored as an opaque blob.
  - Only the fields that make an artifact identifiable are required to draft; the rest are reported as outstanding completeness so a half-prepared package is visible instead of hidden.
  - Publication is denied unless the rights gate and the sponsor gate are both green at authorization, at scheduling, and again at mark-published, because a clearance can be reopened after authorization.
  - Scheduling requires the human authorization receipt first; a future timestamp is the same gate later, never a weaker one.
  - Every delivery attempt, succeeded or failed, appends one immutable delivery receipt at attempt n+1, foreign-keyed to the authorization receipt for that subject and the publish action.
  - A published external identifier is immutable; re-recording the same reference is idempotent and a different one is a conflict.
  - Audio, thumbnail, caption, and failure references are public https URLs or opaque custody references, never contact-like values.
  - An auto-publish webhook stays visibly unconfigured until a show opts into provider_connected outbound mode and a live adapter carries an authenticated smoke receipt.
relationship_map_contract:
  version: 1
  sources: [database, manual, archive]
  export_formats: [mermaid, graphviz, json, csv]
  relationship_classes: [C0, C1, C2, C3, C4, C5]
  edge_types: [worked_with, knows, represented_by, introduced_by, appeared_with]
  legacy_read_state: legacy_unspecified
  invariants:
  - Every source, alias, edge, target, and API read is constrained to one tenant and show.
  - Public archive records contribute only a public guest label, taxonomy-derived class, and bounded opaque provenance reference; private contact-like labels and future appearances are rejected.
  - Private aliases require an opaque private-* id and custody reference; exports always replace their label with Private relationship.
  - Mermaid and Graphviz use generated node ids, CSV uses a fixed column set, and JSON projects only schema-declared fields.
  - Traversal is bidirectional while exports preserve each relationship's declared semantic direction.
  - Reachable C2 and C3 alumni are highlighted through deterministic shortest paths without changing workflow state.
  - Archive repeats are C3 recurring colleagues, high-confidence single appearances are C2 prior professional interactions, and weaker single appearances remain C1 public adjacency.
  - CSV labels neutralize spreadsheet-formula prefixes and target_candidate is true when either declared endpoint is a target.
  - New writes and version 2 configuration accept only canonical edge types; legacy database rows and version 1 configuration project as legacy_unspecified rather than making the map unavailable or inventing a relationship meaning.
analytics_contract:
  version: 1
  providers: [spotify_creator_csv, youtube_analytics, megaphone_chartable_import, custom_csv_http]
  counter_metrics: [downloads, streams, top_clip_views]
  ratio_metrics: [retention_pct, avg_consumption]
  entry_points: [operator_csv_import, bounded_provider_fetch, scheduled_read_job]
  scheduled_job_type: analytics.fetch
  provider_states: [imported, unconfigured, unavailable, blocked]
  default_trend_window: 12
  invariants:
  - Every persisted metric validates against spec/analytics.schema.json and carries the source_receipt_ref of the provider receipt that authorized the read.
  - A fetch writes its provider receipts before importing anything, so a blocked or unconfigured provider leaves an attributable receipt and no metrics.
  - Scheduled analytics work is enqueued as analytics.fetch with execution_kind scheduled and operation read; no analytics path sends, publishes, or mutates a provider.
  - Metric values keep their provider spelling and type verbatim; numeric coercion happens only in the trend projection, where counters are summed and ratios averaged across the providers that reported an episode.
  - Analytics reads are tenant/show scoped, answered with Cache-Control no-store, and never echo a credential reference.
  - Reporting CSV neutralizes spreadsheet-formula prefixes on every non-numeric cell.
