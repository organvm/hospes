version: 1.0.0
working_name: conversation-operations-system
release_target: 1.0.0
configuration_invariant: Compatible runtime, interaction, distribution, and provider modes are additive and configurable; they are never presented as mutually exclusive product choices.
central_aggregate: AppearanceOpportunity
tenancy:
  hierarchy:
  - Network
  - Show
  - Workspace
  invariants:
  - Every record belongs to a tenant boundary.
  - A network-level relationship is not automatically usable by every show.
  - Protected relationships require explicit owner approval before outreach.
  - Customer contact data is never pooled or sold.
multi_show_scope:
  version: 1
  active_authority: show_registry
  partnership_identity: [tenant_id, show_id, template_key]
  scoped_aggregates: [Partnership, PartnershipItem, PartnershipAuditEvent, PilotCandidateSlot, PilotPolicy, PilotRun, CandidateAssignment, AssignmentEvent, PlanProjection, PilotDecision]
  invariants:
  - Operator session, URL, request header, path records, and payload records must resolve to one active tenant show; any mismatch returns 403.
  - A missing tenant record returns 404 only after tenant custody is checked independently of show custody.
  - A partnership template may be imported independently into multiple shows and remains idempotent within each tenant and show.
  - Missing CLI show scope may be inferred only when the tenant has exactly one active registered show.
  - Ambiguous migrated legacy partnerships remain visible to the audited atomic assignment workflow until explicit show custody is assigned across every dependent partnership and Pilot row.
