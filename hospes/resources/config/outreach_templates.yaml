version: 1
class_to_template:
  C0: producer_cold
  C1: producer_cold
  C2: prior_collaborator
  C3: prior_collaborator
templates:
  producer_cold: |-
    **Subject:** Ari Mannis x [GUEST] — [EPISODE TENSION]

    Hi [NAME] —

    I produce a new show with Ari Mannis and [CO-HOST]. Each episode begins with a
    consequential claim, stress-tests it, and ends by making something new rather
    than repeating a standard biography or promotional interview.

    We are developing an episode around **[PRECISE QUESTION OR TENSION]**. [GUEST]'s
    work on **[SPECIFIC VERIFIED PROJECT]** gives us a concrete way into it,
    particularly **[SPECIFIC REASON]**.

    We can record professionally in Los Angeles, New York City, or Austin and route
    the session around [GUEST]'s existing schedule. The recording would take
    approximately [DURATION], and there is no expectation that the guest promote the
    episode.

    Would [GUEST] be open to considering [DATE WINDOW]? I can send the one-page
    editorial brief.

    [REAL SENDER]
    [ROLE]
    [SHOW]
  prior_collaborator: |-
    **Subject:** A new format with Ari — [EPISODE TENSION]

    Hi [NAME] —

    I'm producing a new format with Ari. An earlier conversation touched on
    [VERIFIED SUBJECT], but this episode would pursue a different question:
    **[THESIS]**.

    The show is structured around a claim, a designed stress test, and a final
    artifact. We can record in LA, NYC, or Austin and handle the full production
    process.

    May I send the one-page brief and proposed windows?

    [REAL SENDER]
  ari_note: |-
    **Ari personal note (draft for Ari to review, edit, and send himself):**

    I'm making a new show with [CO-HOST]. We've designed one episode that feels
    specifically right for you: **[ONE SENTENCE]**. Our producer handles the
    logistics, and there's no expectation to promote it. Interested?
