  - number: 9
    title: "Example Private Pilot: record Pilot 1 at earliest confirmed production window"
    dependencies:
      - substrate.storage_migration
      - substrate.encryption_artifacts
      - substrate.authentication_jobs
      - issue:19
      - issue:20
      - issue:21
      - issue:23
      - issue:24
      - issue:26
      - issue:27
      - issue:34
    predicate: python -m pytest tests/issue_predicates/test_issue_09.py -q
    predicate_absent_reason: >-
      The predicate artifact does not exist yet, and deliberately so. This issue closes on a
      real recording — selection, scheduling, authorized correspondence, rehearsal, the take
      itself, a master checksum handoff, and evaluation receipts. None of that has happened.
      A test written now could only assert against fixtures, which would fabricate exactly the
      receipt the close condition exists to demand, and would then report green forever.
      Write tests/issue_predicates/test_issue_09.py when Pilot 1 is recorded, asserting
      against the real receipts, and delete this field in the same change —
      scripts/run_predicates.py reds if this reason outlives the artifact's arrival.
    required_surfaces: [custody, security, documentation, human_receipts]
    receipt_owner: github://organvm/hospes/issues/9
    close_condition: Real Pilot 1 selection, scheduling, authorized correspondence, rehearsal, recording, master checksum handoff, and evaluation receipts exist; rehearsal alone never qualifies.
