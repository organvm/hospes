# HOSPES hardening registry — the deferred review-finding control plane.
#
# Sibling of completion-registry.yaml. That registry owns the SHIPPED surface
# (17 issues, closed); this one owns the DEFERRED surface (109 findings held in
# 11 consolidated hardening issues) so `done.sh` can see review debt instead of
# reporting green above it.
#
# Two rules are load-bearing and are enforced by scripts/check_hardening.py:
#
#   1. No row carries a count, a percentage, or a distance. Open/closed totals,
#      per-severity counts, and ratchet comparisons are DERIVED from the rows
#      and from live GitHub state. There is no field here to lie in.
#   2. Absence must be named. An empty `files` list requires
#      `attribution: unattributed` plus an `attribution_note`; a `severity`
#      whose rank differs from the GitHub `priority` requires a
#      `severity_note`. "N/A" is never a resting state.
#
# `priority` is the label the finding carries on GitHub, recorded as-found and
# never edited here. `severity` is this registry's own re-anchoring. They are
# separate fields on purpose: the backlog's labels are demonstrably mis-anchored
# (path traversal and consent-form clickjacking arrived P2; "register four event
# types in a YAML" arrived P1), and silently overwriting a label would destroy
# the evidence that the re-ranking happened at all.
#
# `files` means WHERE THE FIX LANDS, not where the symptom is observed. For
# H-70.8 that is the schema itself; for H-72.5 it is the validator, not the
# config file it fails to validate.

version: 1
repository: organvm/hospes
registry_owner: hospes/resources/spec/hardening-registry.yaml
campaign: HOSPES 1.0 post-merge hardening
plan: docs/plans/2026-08-15-hospes-heal-expand-ideal-forms.md

# Severity vocabulary — this registry's own anchoring, applied uniformly.
severities:
  S1:
    title: Exploitable, cross-tenant, or legally load-bearing
    definition: >-
      Reachable by an actor who should not reach it (wrong role, other tenant,
      unauthenticated), leaks or crosses a custody boundary, or defeats a
      consent artifact that carries legal weight.
  S2:
    title: Wrong durable data or an unrecoverable state
    definition: >-
      Produces incorrect persisted data (money, receipts, identity, provenance)
      or strands a record in a state the supported API cannot leave.
  S3:
    title: Recoverable, cosmetic, or internal-only
    definition: >-
      Messaging, ordering, developer ergonomics, or a defect whose blast radius
      is a single retry.

# Theme vocabulary — closed. A theme is what makes a SWEEP possible: rows
# sharing a theme share a fix shape, so the theme drives batching, and `phase`
# says which plan phase owns it.
themes:
  authorization:
    title: Server-side role enforcement missing or divergent
    phase: 1
  client-only-gate:
    title: Capability enforced in the client but not the server, or vice versa
    phase: 1
  actor-provenance:
    title: Receipt records a synthesized actor instead of the authenticated one
    phase: 1
  portal-entry-point:
    title: Guest portal application has no production mount
    phase: 2
  portal-intake-bypass:
    title: Portal intake reachable without a session or custody
    phase: 2
  trusted-origins:
    title: Token-bearing origin derived from caller input instead of config
    phase: 2
  error-envelope:
    title: Exception detail flows to an external caller
    phase: 2
  tenant-scoping:
    title: Lookup keyed on show alone, crossing the tenant boundary
    phase: 2
  do-not-contact:
    title: Outbound path not gated on an active do-not-contact directive
    phase: 2
  schema-conformance:
    title: Emitted payload does not satisfy its declared schema
    phase: 2
  canonical-identity:
    title: Identity derived non-injectively or from a non-canonical alias
    phase: 2
  validate-then-commit:
    title: Row committed before the validation that can reject it
    phase: 2
  path-canonicalization:
    title: Prefix matched textually, admitting traversal
    phase: 2
  money-currency:
    title: Minor units summed across differing currencies
    phase: 2
  receipt-provenance:
    title: Receipt timestamp or source taken from the wrong record
    phase: 2
  pagination:
    title: Listing silently truncates at a cap
    phase: 2
  fail-open-predicate:
    title: Guard admits the unenumerated case
    phase: 3
  config-ignored:
    title: Declared configuration is not read at the decision point
    phase: 3
  readiness-probe:
    title: Availability reported without probing the dependency
    phase: 3
  race-and-lock:
    title: Concurrent decision without a lock or a re-read
    phase: 3
  idempotence:
    title: Retry does not converge on the original outcome
    phase: 3
  checksum-verification:
    title: Stored checksum not verified, or absent for migrated rows
    phase: 3
  migration-backfill:
    title: Migration leaves legacy rows in a state later code assumes away
    phase: 3
  dead-end-state:
    title: Record reaches a state the supported API cannot leave
    phase: 3
  input-validation:
    title: Input accepted that downstream code cannot honour
    phase: 3
  lease-lifetime:
    title: Lease shorter than the work it protects
    phase: 3
  active-show-gate:
    title: Write accepted for an inactive or unregistered show
    phase: 3
  aggregation-scope:
    title: Aggregate spans records it should exclude
    phase: 3
  failure-isolation:
    title: One participant's failure aborts or corrupts the batch
    phase: 3
  ordering-and-ranking:
    title: Sort drops or buries records that should surface
    phase: 3
  secret-scanning:
    title: Generated artifact escapes the secret scan
    phase: 3
  domain-kernel-registration:
    title: Executable schema ships contracts the domain kernel does not declare
    phase: 3
  message-quality:
    title: Operator-facing message names the wrong cause
    phase: 3
  brand-resolution:
    title: Brand resolved at the wrong scope or from the wrong source
    phase: 3
  browser-hardening:
    title: Missing browser-side security header on a sensitive surface
    phase: 3
  workspace-bootstrap:
    title: Onboarding leaves the generated workspace unusable
    phase: 3
  state-semantics:
    title: State name asserts something the code did not do
    phase: 3
  missing-read-path:
    title: Data is sealed with no authorized reader
    phase: 3
  client-render-state:
    title: Client renders an action the server will deterministically refuse
    phase: 3
  read-only-mode:
    title: Mutation surface active in a query-only scenario
    phase: 3

# Contradictions the taxonomy surfaced. Each is DECIDED here rather than
# silently resolved by whichever sweep lands first. `resolution` is binding on
# the implementing PR.
contradictions:
  - id: C-1
    between: [H-73.2, H-73.1, H-81.11]
    conflict: >-
      H-73.2 wants the duplicate-receipt lookup ordered BEFORE the
      do-not-contact check so a legitimate provider retry after a later block
      returns the existing receipt; H-73.1 and H-81.11 want do-not-contact
      enforced before any guest-bearing write.
    resolution: >-
      Order duplicate-receipt lookup first, but scope it strictly to returning
      an ALREADY-EXISTING receipt unchanged. Do-not-contact continues to gate
      every path that creates or mutates state. A retry is a read; a mint is a
      write. Implement as two distinct code paths, not one reordered branch.
  - id: C-2
    between: [H-71.5]
    conflict: >-
      Prescribed as a client-only fix ("disable the export button"), which the
      Phase 1 audit flags as the exact shape of a mislabeled server hole.
    resolution: >-
      Treat as server-side until proven otherwise. Before implementing, confirm
      whether the revenue CSV route enforces an export capability; if it does
      not, this row is an `authorization` finding and its theme changes. Do not
      ship the button fix alone.
    needs_code_check: true
  - id: C-3
    between: [H-82.8, H-82.9]
    conflict: >-
      Opposite-direction gating in one file: H-82.8 wants a form HIDDEN for
      blocked cards, H-82.9 wants an action SHOWN for read-only roles.
    resolution: >-
      Both are correct and both are symptoms of gating on a coarse
      manage-capability. Resolve together by splitting view-capability from
      manage-capability at the card level, derived from the Phase 1 capability
      list. Landing either alone re-encodes the other.
  - id: C-4
    between: [H-73.9, H-81.2]
    conflict: >-
      H-73.9 wants `host` ADMITTED to record guest history; H-81.2 wants `host`
      REFUSED a portal-link mint. Read as role statements these contradict.
    resolution: >-
      Not a contradiction once capability replaces role. `host` holds the
      guest-history capability and does not hold the portal-mint capability.
      This is resolvable ONLY by Phase 1; neither row may be implemented as a
      role-list edit beforehand.
  - id: C-5
    between: [H-70.3, H-70.5]
    conflict: >-
      H-70.3 restores a fail-closed status predicate. H-70.5 blocks migrated
      clearances that carry no evidence. Landing H-70.3 alone makes the gate
      look fail-closed while evidence-less migrated rows still pass.
    resolution: >-
      Land as one PR. H-70.3 without H-70.5 is a false closure — the gate reads
      as repaired and the hole it was meant to close stays open.
    landing_constraint: single-pr

