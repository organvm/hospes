[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hospes"
version = "1.0.0"
description = "HOSPES — the deterministic guest-operations engine (guest and host alike)."
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = ["cryptography>=45.0", "Jinja2>=3.1", "PyYAML>=6.0"]

[project.optional-dependencies]
# Starlette 1.6 still imports anyio.abc.BlockingPortal. AnyIO 4.15
# deprecates that alias, failing collection under our warning-as-error policy.
# Keep the latest compatible fixes; remove this test-only bound after a released
# Starlette uses anyio.from_thread.BlockingPortal and the full matrix passes.
test = ["pytest>=7.0", "pytest-cov>=5.0", "anyio>=4.14.2,<4.15"]
# The HTTP surface (hospes.api) is optional. Install with:
# pip install -e '.[api]'
api = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27", "PyJWT[crypto]>=2.9"]
pdf = ["WeasyPrint>=62.0"]
hosted = ["boto3>=1.35", "psycopg[binary]>=3.2", "PyJWT[crypto]>=2.9"]

[project.scripts]
hospes = "hospes.__main__:main"

[tool.setuptools]
packages = ["hospes", "hospes.resources"]

[tool.setuptools.package-data]
hospes = ["resources/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Ensure repo root + tests dir are importable so `from conftest import ...` and
# `import hospes` both resolve when run from the repo root.
pythonpath = [".", "tests"]
filterwarnings = [
    "error",
    "ignore:Using `httpx` with `starlette.testclient` is deprecated.*",
]

[tool.coverage.run]
branch = false
source = ["hospes"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = false
exclude_also = ["def cmd_demo_open"]
